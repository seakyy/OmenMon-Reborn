#
# OmenMon Automated Release Workflow
# Stage 1: Unit Tests
# Stage 2: Compile Executable
# Stage 3: Package ZIP & Publish Release

name: "OmenMon Release"
run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to release (e.g. v1.4.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  stage1-unit-tests:
    name: "Stage 1: Unit Tests"
    runs-on: windows-2022

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up .NET 8 SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Run Unit Tests"
        run: |
          dotnet test Tests/OmenMon.Tests/OmenMon.Tests.csproj -c Release --nologo

  stage2-compile:
    name: "Stage 2: Compile Executable"
    needs: stage1-unit-tests
    runs-on: windows-2022

    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Resolve Tag and Version"
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Release for Tag: $TAG (Version: $VERSION)"

      - name: "Set up .NET 8 SDK"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: "Set up MSBuild"
        uses: microsoft/setup-msbuild@v2

      - name: "Build Solution with Root OmenMon.xml"
        run: |
          msbuild -m -noLogo /restore -p:Configuration=Release -p:AssemblyVersion=${{ steps.resolve.outputs.version }}.${{ github.run_number }} -p:AssemblyVersionWord=reborn -t:Rebuild OmenMon.sln

      - name: "Verify Build Outputs"
        shell: powershell
        run: |
          if (-not (Test-Path "Bin\OmenMon.exe")) { throw "Bin\OmenMon.exe missing!" }
          if (-not (Test-Path "Bin\OmenMon.xml")) { throw "Bin\OmenMon.xml missing!" }

      - name: "Retrieve & Decode Certificate (Optional)"
        if: ${{ secrets.CODE_SIGN_CERT != '' }}
        shell: bash
        run: |
          echo "${{ secrets.CODE_SIGN_CERT }}" > OmenMon-GitHub.pfx.txt
          certutil -decode OmenMon-GitHub.pfx.txt OmenMon-GitHub.pfx

      - name: "Sign OmenMon Executable (Optional)"
        if: ${{ secrets.CODE_SIGN_CERT != '' }}
        run: |
          & 'C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe' sign /d OmenMon /du https://omenmon.github.io/ /f OmenMon-GitHub.pfx /fd sha256 /td sha256 /tr http://timestamp.digicert.com/ /v Bin\OmenMon.exe

      - name: "Upload Stage 2 Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            Bin/OmenMon.exe
            Bin/OmenMon.xml
          if-no-files-found: error

  stage3-package-and-release:
    name: "Stage 3: Package ZIP & Publish Release"
    needs: [stage1-unit-tests, stage2-compile]
    runs-on: windows-2022

    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Download Stage 2 Build Artifact"
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: Bin

      - name: "Extract Release Notes from CHANGELOG.md"
        id: notes
        shell: bash
        run: |
          TAG="${{ needs.stage2-compile.outputs.tag }}"
          VERSION="${{ needs.stage2-compile.outputs.version }}"
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## / {
              if (found) exit
              if (index($0, "[" ver "-reborn]") > 0 || index($0, "[" ver "]") > 0) {
                found=1; next
              }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "Release **${TAG}**" > release-notes.md
            echo "" >> release-notes.md
            echo "Automated release built by GitHub Actions." >> release-notes.md
          fi

          echo "--- Release Notes ---"
          cat release-notes.md
          echo "---------------------"

      - name: "Package Release Assets (.zip)"
        shell: powershell
        run: |
          $tag = "${{ needs.stage2-compile.outputs.tag }}"
          $zipName = "OmenMon-$tag-Release.zip"

          Copy-Item "Bin\OmenMon.exe" -Destination "OmenMon.exe" -Force

          $filesToZip = @(
            "ARCHITECTURE.md",
            "CHANGELOG.md",
            "INSTRUCTION.md",
            "LICENSE.md",
            "MODIFICATIONS.md",
            "OmenMon.exe",
            "OmenMon.xml",
            "README.md",
            "SECURITY.md"
          )

          Compress-Archive -Path $filesToZip -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: "Generate SHA-256 Checksums"
        shell: powershell
        run: |
          $zipName = $env:ZIP_NAME
          $tag = "${{ needs.stage2-compile.outputs.tag }}"
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path $zipName).Hash.ToLower()
          $exeHash = (Get-FileHash -Algorithm SHA256 -Path "OmenMon.exe").Hash.ToLower()
          $shaContent = @"
# OmenMon-Reborn $tag — SHA-256 checksums
# Build #$env:GITHUB_RUN_NUMBER * $(Get-Date -Format 'yyyy-MM-dd HH:mm') UTC
# Verify on Windows: Get-FileHash -Algorithm SHA256 <file>

$zipHash  $zipName
$exeHash  OmenMon.exe
"@
          Set-Content -Path "SHA256SUMS.txt" -Value $shaContent
          Get-Content "SHA256SUMS.txt"

      - name: "Publish GitHub Release"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.stage2-compile.outputs.tag }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists. Updating release assets and notes..."
            gh release edit "$TAG" --draft=false --title "OmenMon $TAG" --notes-file release-notes.md
            gh release upload "$TAG" OmenMon.exe "$ZIP_NAME" SHA256SUMS.txt --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" OmenMon.exe "$ZIP_NAME" SHA256SUMS.txt \
              --title "OmenMon $TAG" \
              --notes-file release-notes.md
          fi
